name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub releases
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # tags and history for build.version and changelogs
      - uses: DomenikIrrgang/wowlua/.github/actions/setup-wowlua@main
      - uses: actions/cache@v4
        with:
          path: ~/.wowlua/cache
          key: wowlua-${{ hashFiles('wowlua.lock') }}
      # The gallery tests take screenshots, which need a GPU; lavapipe is a software one.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: wowlua check --locked --message-format github
      - run: wowlua test --locked --message-format github
      - run: wowlua build --release --locked
      - if: startsWith(github.ref, 'refs/tags/')
        run: wowlua publish --no-test # the tests above already passed
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
